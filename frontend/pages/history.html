<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử sự kiện | AECPT</title>
    <script src="../js/i18n.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/sidebar.css">
    <link rel="stylesheet" href="../styles/history.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div id="sidebar-container"></div>

    <main class="main-content">
        <section class="history-page">
            <header class="history-header">
                <div class="page-heading">
                    <h1>Lịch sử sự kiện</h1>
                    <p>Xem lại sự kiện và công việc từ dữ liệu ban Multimedia.</p>
                </div>
            </header>

            <div class="history-toolbar">
                <label class="history-search">
                    <i data-lucide="search"></i>
                    <input id="eventSearch" type="search" placeholder="Tìm kiếm tên sự kiện..." autocomplete="off">
                </label>
                <label class="history-year">
                    <span class="sr-only">Lọc theo năm</span>
                    <select id="yearFilter" aria-label="Lọc theo năm">
                        <option value="all">Tất cả năm</option>
                    </select>
                </label>
            </div>

            <div class="history-list-heading">
                <strong id="eventCount">Đang tải sự kiện...</strong>
                <span>Sắp xếp theo ngày kết thúc gần nhất</span>
            </div>

            <div class="history-table" aria-label="Danh sách sự kiện">
                <div class="history-table-head">
                    <span>Tên sự kiện</span>
                    <span>Ngày bắt đầu</span>
                    <span>Ngày kết thúc</span>
                    <span>Trạng thái</span>
                    <span></span>
                </div>
                <div id="eventList" aria-live="polite">
                    <div class="history-message">Đang tải dữ liệu từ Supabase...</div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/history.js"></script>
</body>

</html>
