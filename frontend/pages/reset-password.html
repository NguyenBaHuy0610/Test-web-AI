<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu | AECPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="stylesheet" href="../styles/reset-password.css">
</head>
<body>
    <main class="login-layout reset-password-layout">
        <section class="form-panel" aria-labelledby="resetPasswordTitle">
            <div class="login-box">
                <div class="form-heading">
                    <span class="welcom-lable">KHÔI PHỤC TÀI KHOẢN</span>
                    <h2 id="resetPasswordTitle">Đặt lại mật khẩu</h2>
                    <p>Chọn mật khẩu mới cho tài khoản của bạn.</p>
                </div>

                <p id="recoveryStatus" class="form-feedback" role="status" aria-live="polite">
                    Đang xác minh liên kết khôi phục...
                </p>

                <form id="resetPasswordForm" hidden>
                    <div class="field-group">
                        <label for="newPassword">Mật khẩu mới</label>
                        <div class="input-wrap">
                            <input type="password" id="newPassword" name="newPassword"
                                   autocomplete="new-password" minlength="8" required>
                        </div>
                    </div>

                    <div class="field-group">
                        <label for="confirmPassword">Nhập lại mật khẩu mới</label>
                        <div class="input-wrap">
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   autocomplete="new-password" minlength="8" required>
                        </div>
                    </div>

                    <button type="submit" class="submit-button" id="resetPasswordSubmit">
                        Cập nhật mật khẩu
                    </button>
                    <p id="resetFeedback" class="form-feedback" role="status" aria-live="polite"></p>
                </form>

                <p class="auth-switch">
                    <a href="login.html">Quay lại đăng nhập</a>
                </p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/reset-password.js"></script>
</body>
</html>
